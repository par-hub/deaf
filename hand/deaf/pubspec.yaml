name: deaf
description: "ISL (Indian Sign Language) speech-to-avatar app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0

  # networking
  http: ^1.2.2

  # audio recording
  record: ^6.0.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
